name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install psutil

      - name: Syntax-check every module
        # A pure syntax/compile check — deliberately doesn't need PyGObject
        # or GTK installed, since py_compile never executes the imports it
        # compiles. Real GTK verification happens by hand (see README).
        run: python -m py_compile $(find src -name '*.py')

      - name: Run unit tests
        # Only the GTK-free modules (metrics, settings, paths, themes,
        # process_classify) are unit-tested; anything that imports gi/Gtk
        # is UI code, verified by hand on a real desktop instead.
        run: |
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=src python -m unittest discover -s tests -v
