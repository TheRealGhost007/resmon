[project]
name = "resmon"
version = "0.1.0"
description = "A clean, modern system resource monitor: full app + desktop overlay widget, built for Hyprland/Omarchy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "TheRealGhost007" },
]
keywords = ["system-monitor", "gtk4", "libadwaita", "hyprland", "omarchy", "wayland"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "psutil>=6.0",
    "PyGObject>=3.48",
]

[project.urls]
Homepage = "https://github.com/TheRealGhost007/resmon"
Repository = "https://github.com/TheRealGhost007/resmon"
Issues = "https://github.com/TheRealGhost007/resmon/issues"

[project.scripts]
resmon = "resmon.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resmon = ["*.css"]
